spring:
  application:
    name: doclens
  datasource:
    url: ${DOCLENS_DB_URL:jdbc:postgresql://localhost:5432/doclens}
    username: ${DOCLENS_DB_USER:doclens}
    password: ${DOCLENS_DB_PASSWORD:doclens}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small

doclens:
  storage:
    path: ${DOCLENS_STORAGE_PATH:./storage}
