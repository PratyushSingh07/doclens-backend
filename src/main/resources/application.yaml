spring:
  application:
    name: doclens
  datasource:
    url: ${DOCLENS_DB_URL:jdbc:postgresql://localhost:5432/doclens}
    username: ${DOCLENS_DB_USER:doclens}
    password: ${DOCLENS_DB_PASSWORD:doclens}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
